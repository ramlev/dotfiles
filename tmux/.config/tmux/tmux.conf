# ~/.config/tmux/tmux.conf

# ── Prefix ───────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g detach-on-destroy off
set -sg escape-time 10
set -g display-time 2000
set -g set-clipboard on
setw -g mode-keys vi

# True colour, undercurls, and image/OSC passthrough for nvim.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -g allow-passthrough on

# ── Keys ─────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Splits keep the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Repeatable resizing: hold the prefix-less key after the first press.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Visual selection that behaves like vim.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Popups. (prefix p is the floating shell, bound by tmux-floax)
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# ── Statusline ───────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# ── Plugins (tpm) ────────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ── Floating shell (tmux-floax) ──────────────────────────────────────────
# A persistent scratch session in a popup: pop out mid-command, pop back in
# and it is still running. Native display-popup would spawn a fresh shell.
set -g @floax-bind 'p'
set -g @floax-bind-menu 'P'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'
set -g @floax-title 'scratch'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'

# ── Catppuccin ───────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag, ,}'

# Pane borders go through catppuccin's own variables: it sets pane-border-style
# from these, and a plain `set -g pane-border-style` cannot win, since run-shell
# defers the script until the whole config file has been parsed.
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_red},fg=#{@thm_mauve}}}"

# Catppuccin must load before its @catppuccin_status_* modules are referenced.
# Under tpm the plugin dir is plugins/tmux, not plugins/catppuccin/tmux.
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g  status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ── Active pane ──────────────────────────────────────────────────────────
# Only the shell's own output dims; full-screen TUIs paint their own
# background over it, so the border carries the signal where dimming cannot.
# Border colours live above, next to the other catppuccin settings.
set -g window-style        'fg=#a6adc8,bg=#181825'
set -g window-active-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g pane-border-lines heavy

# Must stay last.
run '~/.config/tmux/plugins/tpm/tpm'
