# ~/.config/tmux/tmux.conf — omerxx's setup, Nord palette.
# Keybindings live in tmux.reset.conf.
source-file ~/.config/tmux/tmux.reset.conf

# ── Terminal ─────────────────────────────────────────────────────────────
# Not "${TERM}": xterm-ghostty inside tmux breaks on hosts without its terminfo.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -g allow-passthrough on

# ── General ──────────────────────────────────────────────────────────────
set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g mouse on
set -g focus-events on
set -g status-position top       # macOS / darwin style
set -g status-interval 5
setw -g mode-keys vi

# ── Nord palette ─────────────────────────────────────────────────────────
# Referenced as #{@nordN} so hex digits are never read as #D/#F aliases.
set -g @nord0  "#2E3440"   # polar night
set -g @nord1  "#3B4252"
set -g @nord2  "#434C5E"
set -g @nord3  "#4C566A"
set -g @nord4  "#D8DEE9"   # snow storm
set -g @nord5  "#E5E9F0"
set -g @nord6  "#ECEFF4"
set -g @nord7  "#8FBCBB"   # frost
set -g @nord8  "#88C0D0"
set -g @nord9  "#81A1C1"
set -g @nord10 "#5E81AC"
set -g @nord11 "#BF616A"   # aurora: red
set -g @nord12 "#D08770"   #         orange
set -g @nord13 "#EBCB8B"   #         yellow
set -g @nord14 "#A3BE8C"   #         green
set -g @nord15 "#B48EAD"   #         purple

# ── Colours ──────────────────────────────────────────────────────────────
set -g pane-active-border-style "fg=#88C0D0,bg=default"
set -g pane-border-style        "fg=#4C566A,bg=default"
set -g popup-border-style       "fg=#88C0D0"
set -g message-style            "fg=#88C0D0,bg=#3B4252"
set -g message-command-style    "fg=#88C0D0,bg=#3B4252"
set -g mode-style               "fg=#ECEFF4,bg=#434C5E"
set -g display-panes-active-colour "#88C0D0"
set -g display-panes-colour        "#4C566A"
setw -g clock-mode-colour          "#88C0D0"

# ── Status bar ───────────────────────────────────────────────────────────
# Same shape as omerxx's catppuccin bar: session pill on the left, windows as
# "name █N" pills with the number block on the right, directory on the right.
set -g status-style "bg=default,fg=#D8DEE9"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator ""

# Session: green, turns red while the prefix is held.
set -g status-left "#[fg=#{?client_prefix,#{@nord11},#{@nord14}},bg=default]#[fg=#{@nord0},bg=#{?client_prefix,#{@nord11},#{@nord14}}] #[fg=#{@nord6},bg=#{@nord1}] #S#[fg=#{@nord1},bg=default] "

setw -g window-status-format         "#[fg=#{@nord1},bg=default]#[fg=#{@nord4},bg=#{@nord1}]#W #[fg=#{@nord3}]█#[fg=#{@nord6},bg=#{@nord3}]#I#[fg=#{@nord3},bg=default] "
setw -g window-status-current-format "#[fg=#{@nord1},bg=default]#[fg=#{@nord6},bg=#{@nord1},bold]#W#{?window_zoomed_flag, ,} #[fg=#{@nord8},nobold]█#[fg=#{@nord0},bg=#{@nord8}]#I#[fg=#{@nord8},bg=default] "

set -g status-right "#[fg=#{@nord9},bg=default]#[fg=#{@nord0},bg=#{@nord9}] #[fg=#{@nord6},bg=#{@nord1}] #{b:pane_current_path}#[fg=#{@nord1},bg=default]"

# ── Plugins ──────────────────────────────────────────────────────────────
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'cyan'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/Users/hasse/.dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/.dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Must stay last.
run '~/.config/tmux/plugins/tpm/tpm'
