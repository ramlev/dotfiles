# ~/.config/tmux/tmux.conf — omerxx's setup, TokyoNight Night palette.
# Keybindings live in tmux.reset.conf.
source-file ~/.config/tmux/tmux.reset.conf

# ── Terminal ─────────────────────────────────────────────────────────────
# Not "${TERM}": xterm-ghostty inside tmux breaks on hosts without its terminfo.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -g allow-passthrough on

# ── General ──────────────────────────────────────────────────────────────
set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g mouse on
set -g focus-events on
set -g status-position top       # macOS / darwin style
set -g status-interval 5
setw -g mode-keys vi

# ── TokyoNight Night palette ─────────────────────────────────────────────
# Same values as ghostty's "TokyoNight Night" theme and btop's "tokyo-night".
# Referenced as #{@tn_*} so hex digits are never read as #D/#F aliases.
set -g @tn_bg      "#1a1b26"   # background
set -g @tn_bg_dark "#16161e"
set -g @tn_bg_hl   "#292e42"   # pill background
set -g @tn_gutter  "#3b4261"
set -g @tn_black   "#414868"   # bright black / dim text
set -g @tn_comment "#565f89"
set -g @tn_fg_dark "#a9b1d6"
set -g @tn_fg      "#c0caf5"   # foreground
set -g @tn_blue    "#7aa2f7"
set -g @tn_cyan    "#7dcfff"   # accent
set -g @tn_teal    "#73daca"
set -g @tn_magenta "#bb9af7"
set -g @tn_red     "#f7768e"
set -g @tn_orange  "#ff9e64"
set -g @tn_yellow  "#e0af68"
set -g @tn_green   "#9ece6a"

# ── Colours ──────────────────────────────────────────────────────────────
set -g pane-active-border-style "fg=#7dcfff,bg=default"
set -g pane-border-style        "fg=#414868,bg=default"
set -g popup-border-style       "fg=#7dcfff"
set -g message-style            "fg=#7dcfff,bg=#292e42"
set -g message-command-style    "fg=#7dcfff,bg=#292e42"
set -g mode-style               "fg=#c0caf5,bg=#3b4261"
set -g display-panes-active-colour "#7dcfff"
set -g display-panes-colour        "#414868"
setw -g clock-mode-colour          "#7dcfff"

# ── Status bar ───────────────────────────────────────────────────────────
# Minimal: one filled pill for the session, windows as plain text with the
# current one in a soft pill, muted info on the right. A blank second line
# gives the bar some air above the panes (remove the two status lines to drop it).
set -g status 2
set -g status-format[1] ""
set -g status-style "bg=default,fg=#{@tn_fg_dark}"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator ""

# Accent: blue normally, red while prefix is held, yellow in copy mode.
set -g @tn_accent "#{?client_prefix,#{@tn_red},#{?pane_in_mode,#{@tn_yellow},#{@tn_blue}}}"

set -g status-left "#[fg=#{E:@tn_accent},bg=default]#[fg=#{@tn_bg},bg=#{E:@tn_accent},bold] #S#[fg=#{E:@tn_accent},bg=default,nobold]  "

# Both formats are the same width so switching windows never shifts the bar.
setw -g window-status-format         " #[fg=#{@tn_comment}]#I #[fg=#{@tn_fg_dark}]#W#{?window_bell_flag, #[fg=#{@tn_red}]●,#{?window_activity_flag, #[fg=#{@tn_yellow}]●,}} "
setw -g window-status-current-format "#[fg=#{@tn_gutter},bg=default]#[fg=#{@tn_cyan},bg=#{@tn_gutter},bold]#I #[fg=#{@tn_fg}]#W#{?window_zoomed_flag, #[fg=#{@tn_yellow}],}#[fg=#{@tn_gutter},bg=default,nobold]"

set -g status-right "#[fg=#{@tn_comment}] #[fg=#{@tn_fg_dark}]#{b:pane_current_path}  #[fg=#{@tn_comment}] #[fg=#{@tn_fg_dark}]%H:%M "

# ── Plugins ──────────────────────────────────────────────────────────────
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'cyan'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/Users/hasse/.dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/.dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @resurrect-strategy-nvim 'session'

# Bootstrap TPM and plugins on a fresh machine.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Must stay last.
run '~/.config/tmux/plugins/tpm/tpm'
